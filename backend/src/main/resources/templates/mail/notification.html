<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SIGESA — Notificación</title>
</head>
<body style="margin:0;padding:0;background-color:#F8F9FA;font-family:Inter,Segoe UI,Arial,sans-serif;color:#191C1D;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#F8F9FA;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:640px;background-color:#FFFFFF;border:1px solid #E1E3E4;">
          <tr>
            <td style="background-color:#003770;padding:20px 28px;">
              <div style="font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#A9C7FF;">Universidad Mayor de San Simón</div>
              <div style="font-size:22px;font-weight:700;color:#FFFFFF;margin-top:4px;">SIGESA</div>
            </td>
          </tr>
          <tr>
            <td style="padding:28px;">
              <h1 style="margin:0 0 12px 0;font-size:20px;font-weight:600;color:#003770;">{{subject}}</h1>
              <p style="margin:0 0 16px 0;font-size:16px;line-height:1.5;color:#191C1D;">{{body}}</p>
              <p style="margin:0 0 24px 0;font-size:14px;line-height:1.5;color:#737781;">Esta es una notificación automática del sistema de acreditación SIGESA.</p>
              <a href="{{ctaUrl}}" style="display:inline-block;background-color:#003770;color:#FFFFFF;text-decoration:none;font-size:14px;font-weight:600;padding:12px 20px;">
                Abrir en SIGESA
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 28px;background-color:#F3F4F5;border-top:1px solid #E1E3E4;font-size:12px;color:#737781;">
              Remitente: no-reply@umss.edu.bo · No responder a este correo.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
