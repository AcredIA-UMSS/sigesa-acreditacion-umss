spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/sigesa}
    username: ${SPRING_DATASOURCE_USERNAME:sigesa_user}
    password: ${SPRING_DATASOURCE_PASSWORD:sigesa_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Dev Docker: Hibernate alinea entidades JPA; migraciones V14+ requieren backfill manual
      # o Flyway baseline si el volumen Postgres es anterior a release 2.0.0.
      ddl-auto: update
  flyway:
    enabled: false