spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/sigesa}
    username: ${SPRING_DATASOURCE_USERNAME:sigesa_user}
    password: ${SPRING_DATASOURCE_PASSWORD:sigesa_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: sigesa-hikari-qa
      maximum-pool-size: ${SIGESA_HIKARI_MAX_POOL:15}
      minimum-idle: ${SIGESA_HIKARI_MIN_IDLE:2}
      connection-timeout: ${SIGESA_HIKARI_CONNECTION_TIMEOUT_MS:30000}
      idle-timeout: ${SIGESA_HIKARI_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${SIGESA_HIKARI_MAX_LIFETIME_MS:1800000}
      leak-detection-threshold: ${SIGESA_HIKARI_LEAK_DETECTION_MS:20000}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
  sql:
    init:
      mode: never
