# docker-compose.yml

services:
  db:
    image: postgres:16-alpine
    container_name: sigesa-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/seed.sql:/docker-entrypoint-initdb.d/seed.sql

  ollama:
    image: ollama/ollama:latest
    container_name: sigesa-ollama
    restart: unless-stopped
    environment:
      OLLAMA_MODELS: /root/.ollama
    volumes:
      # - /var/lib/ollama/blobs:/root/.ollama/blobs:ro
      # - /var/lib/ollama/manifests:/root/.ollama/manifests:ro
      - ollama_state:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "3001:8080"
    volumes:
      - open-webui:/app/backend/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sigesa-backend
    restart: always
    depends_on:
      db:
        condition: service_started
      open-webui:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_URL=${DB_URL}
      - DB_USERNAME=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - SIGESA_JWT_SECRET=${SIGESA_JWT_SECRET}
      - SPRING_DATASOURCE_URL=${DB_URL}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SIGESA_ASSISTANT_BASE_URL=http://open-webui:8080/api
      - SIGESA_ASSISTANT_API_KEY=${SIGESA_ASSISTANT_API_KEY}
      - SIGESA_ASSISTANT_MODEL=${SIGESA_ASSISTANT_MODEL}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: sigesa-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80" # Mapea el puerto 80 del contenedor al 3000 de tu host

volumes:
  postgres_data:
  open-webui:
  ollama_state: