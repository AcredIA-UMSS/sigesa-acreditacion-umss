name: OpenAPI contract

on:
  pull_request:
    branches:
      - main
      - 'release/**'
  push:
    branches:
      - main
      - 'release/**'

jobs:
  openapi:
    name: Drift + Spectral
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Generar openapi.json desde springdoc
        working-directory: backend
        env:
          OPENAPI_WRITE: 'true'
        run: ./mvnw -B -Dtest=OpenApiExportIT test

      - name: Detectar drift (contrato committed vs código)
        run: git diff --exit-code -- openapi.json

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Spectral lint (falla si hay error según .spectral.yml)
        run: npx --yes @stoplight/spectral-cli@6.15.0 lint openapi.json --ruleset .spectral.yml --fail-severity error
